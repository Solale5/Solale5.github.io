<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/jpg" href="images/cropped-s-favicon.ico" />
    <title>Page Not Found</title>
    <style>
      .not-found {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .not-found h1 {
        font-size: 6rem;
        margin: 0;
        color: #4f8bdf;
      }
      .not-found p {
        font-size: 1.2rem;
        color: #e9edf2;
        margin: 10px 0 30px 0;
      }
      .not-found a {
        color: #4f8bdf;
        font-size: 1.1rem;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="not-found">
      <h1>404</h1>
      <p>This page doesn't exist &mdash; probably a broken or outdated link.</p>
      <a href="/">Back to the homepage</a>
    </div>
  </body>
</html>
